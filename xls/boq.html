our.",null,37],"19,1":["•  Concrete pump booked on the pour days for each group (see Section C).",null,37],"20,1":["•  Lead time for BuildEase Pre-Cut Service: 5–6 weeks from order placement; procurement runs in parallel with mobilisation.",null,37],"21,1":["•  Programme estimates are provided in good faith and must be verified by the project / site management team.",null,37],"22,1":["•  ENGLAND: the design must satisfy the Building Regulations 2010 (Approved Documents A-S) - building control by LABC / an approved inspector; NOT the Scottish technical handbooks. Building height (ADB Diagram D6, to the floor of the top storey): the 3F (Flat 5 attic) FFL is 8,229.6 above the GF FFL, ~8.38 m above the lowest adjoining ground (ground ASSUMED ~150 below GF FFL all round - to be confirmed on a measured survey) - BELOW 11 m (margin ~2.6 m), so the 11-18 m fire band (ADB B4 external-wall materials, sprinklers in new blocks of flats) does not apply. 4 storeys incl. the attic: the LABC Warranty technical manual caps ICF at 3 storeys unless an independent engineer inspects each pour (pre-pour) and signs off - the warranty provider must confirm. Flats = Consequence Class 2A (Approved Document A): floor-to-wall ties / anchorage are engineer-designed (outside the manufacturer tables).",null,37],"23,1":["•  Programme: 2 weeks per floor on this project - the FB, GF, 1F, 2F and 3F lifts are each one 2-week block (ICF erection 6 days, pour, cure, then the floor slot); the roof follows the 3F pour. Every floor is PRECAST BEAM & BLOCK BY OTHERS (beam supplier / groundworker with a crane; the joinery crew attends): GF 150 B&B + 150 insulation + 50 screed (top of screed = FFL); 1F / 2F / 3F 150 B&B + 100 concrete topping + 25 levelling screed. The beams bear on the ICF core (inner panel cut down at the bearing course - ICF erector coordination). Floor beams, blocks, screeds and their craneage are NOT in this ICF BOQ (coordination quantities in the finishes package Bill 6).",null,37],"24,1":["•  Build sequence (no client programme issued): FB foundation (2 courses on the strip footing by others) -> pour -> GF B&B floor -> L1 GF walls (6 courses) -> pour -> 1F B&B floor (incl. the roof terrace over GF Flat 2; indicative transfer steels T1 / T2 by the engineer) -> L2 1F walls -> pour -> 2F B&B floor -> L3 2F walls -> pour -> 3F B&B floor -> L4 3F eaves walls (cut at 9,144) + the NE party wall to 11,430 -> pour -> roof (cut roofs C24 @ 600, natural slate 33 deg).",null,37],"25,1":["•  ICF pours sized at 60 m3 per pump per day from each lift's own concrete volume.",null,37],"26,1":["•  PROGRAMME (BOQ Builder sheet 'Programme', 1 ICF crew of 8 + 1 joinery crew of 3): 2 WEEKS PER FLOOR - FB, GF, 1F, 2F and 3F each one 2-week block (ICF erection + snag 6 days, pour 1, cure 2, floor slot 1; the roof after the 3F pour): 50 working days = 10 weeks. Sequence: ICF FB d0-6; pour d6-7; cure d7-9; GF precast beam & block floor d9-10; ICF L1 d10-16; pour d16-17; cure d17-19; 1F B&B floor d19-20; ICF L2 d20-26; pour d26-27; cure d27-29; 2F B&B floor d29-30; ICF L3 d30-36; pour d36-37; cure d37-39; 3F B&B floor d39-40; ICF L4 d40-46; pour d46-47; cure d47-49; roof d49-50. ICF concrete 111.43 m3 (geometric, 709 ordered forms: FB 12.46 / L1 31.95 / L2 32.80 / L3 24.64 / L4 9.57) in 5 pump days. ALIGNMENT: the proposal prices 4 stillages x 10 weeks hire (GBP 3,200.00); on this programme the alignment is needed from the first ICF lift (FB, day 0) to the last pour (L4, day 47) = 10 weeks on hire - the same as priced. The proposal prices the alignment hire for this programme.",null,37],"27,1":["•  Site access: corner plot on residential streets in Clapham (London) - articulated delivery access, unloading and any road / parking suspension by the contractor for the 3 deliveries (33 pallets + 4 alignment stillages); a transfer to smaller vehicles is not included.",null,37]},"freeze":null,"tab":null},{"name":"Summary","cols":[75,425,131,145,145,89],"heights":{"1":48,"2":11,"3" are by others.",null,74],"6,1":["1  Purpose, status, England and building height",null,100],"7,1":["1.1",null,72],"7,2":["ENGLAND: the design must satisfy the Building Regulations 2010 (Approved Documents A-S) - building control by LABC / an approved inspector; NOT the Scottish technical handbooks. Building height (ADB Diagram D6, to the floor of the top storey): the 3F (Flat 5 attic) FFL is 8,229.6 above the GF FFL, ~8.38 m above the lowest adjoining ground (ground ASSUMED ~150 below GF FFL all round - to be confirmed on a measured survey) - BELOW 11 m (margin ~2.6 m), so the 11-18 m fire band (ADB B4 external-wall materials, sprinklers in new blocks of flats) does not apply. 4 storeys incl. the attic: the LABC Warranty technical manual caps ICF at 3 storeys unless an independent engineer inspects each pour (pre-pour) and signs off - the warranty provider must confirm. Flats = Consequence Class 2A (Approved Document A): floor-to-wall ties / anchorage are engineer-designed (outside the manufacturer tables).",null,76],"8,1":["1.2",null,72],"8,2":["ENGINEER / SPECIALISTS TO DESIGN (floors, steels, roof timbers, partitions and glazing are in the model for coordination only): STRUCTURAL ENGINEER: the indicative steels S1 / T1 / T2 incl. the TRANSFER beams under the 1F north wall (T1) and the wing east wall (T2) over the GF Flat 2 living room; padstones / pocket bearings in the ICF core (form at the pour of the lift below); the B&B bearings on the ICF core; floor-to-wall ties (Consequence Class 2A); the main roof (unpropped hip heads, room-in-roof without ties - structural ridge / purlins); the strip footing; the NE party-wall foundation next to No. 27.",null,76],"9,1":["1.3",null,72],"9,2":["This package presents the finishes and ancillary-trade quantities measured by BuildEase alongside the Nudura ICF quotation for Bromfelde Corner, 25 Bromfelde Road, Clapham (ref ES26-087). It is set out as a Bill of Quantities so that the client, their quantity surveyor and trade contractors can price and coordinate the works.",null,76],"10,1":["1.4",null,72],"10,2":["Status: FOR INFORMATION, COORDINATION AND PRICING BY OTHERS - NOT FOR CONSTRUCTION. Supply and install rates are left blank deliberately - BuildEase / Tremco CPG are not pricing these trades. The Excel workbook is a live pricing document: enter rates and every amount, subtotal and total updates by formula.",null,76],"11,1":["1.5",null,72],"11,2":["The ICF kit, concrete core, pumping, ICF / floor / roof labour and the build programme are in the BuildEase BOQ Builder sheets of this workbook (Cover / Programme / Summary / A-F). The finishes cover carries a named hook (ICF_PACKAGE_TOTAL) linked to that NET TOTAL.",null,76],"12,1":["1.6",null,72],"12,2":["PROGRAMME (BOQ Builder sheet 'Programme', 1 ICF crew of 8 + 1 joinery crew of 3): 2 WEEKS PER FLOOR - FB, GF, 1F, 2F and 3F each one 2-week block (ICF erection + snag 6 days, pour 1, cure 2, floor slot 1; the roof after the 3F pour): 50 working days = 10 weeks. Sequence: ICF FB d0-6; pour d6-7; cure d7-9; GF precast beam & block floor d9-10; ICF L1 d10-16; pour d16-17; cure d17-19; 1F B&B floor d19-20; ICF L2 d20-26; pour d26-27; cure d27-29; 2F B&B floor d29-30; ICF L3 d30-36; pour d36-37; cure d37-39; 3F B&B floor d39-40; ICF L4 d40-46; pour d46-47; cure d47-49; roof d49-50. ICF concrete 111.43 m3 (geometric, 709 ordered forms: FB 12.46 / L1 31.95 / L2 32.80 / L3 24.64 / L4 9.57) in 5 pump days. ALIGNMENT: the proposal prices 4 stillages x 10 weeks hire (GBP 3,200.00); on this programme the alignment is needed from the first ICF lift (FB, day 0) to the last pour (L4, day 47) = 10 weeks on hire - the same as priced. The proposal prices the alignment hire for this programme.",null,76],"13,1":["1.7",null,72],"13,2":["This information is supplied in good faith for guidance and coordination only. It is not part of the Nudura ICF price and must be checked and verified by the appropriate professional (quantity surveyor, designer, engineer or supplier) before use. Only the Nudura ICF formwork and associated accessories are included in our price.",null,77],"14,1":["1.8",null,72],"14,2":["Quantities are measured from the BuildEase quotation model of the Basis Point Design planning drawings P01-P16 Rev E (10.03.2022, 1:100 @ A3: plans, elevations, sections); no allowance for waste is included unless stated. Quantity columns are the model levels FB / L1 (GF) / L2 (1F) / L3 (2F) / L4 (3F) and the Roof; the Site total is their sum. Rates and amounts are by others.",null,77],"16,1":["2  Basis of measurement",null,100],"17,1":["2.1",null,72],"17,2":["Measured generally in accordance with the principles of NRM2 (RICS New Rules of Measurement): work measured net as fixed in position, grouped by work section, units m / m2 / nr / item. NRM2 is referenced for structure only; descriptions are BuildEase's own.",null,76],"18,1":["2.2",null,72],"18,2":["Quantities are NET. No allowance for waste, laps, cutting or breakage is included unless stated; an \"Order guide\" with a stated waste % is guidance only.",null,76],"19,1":["2.3",null,72],"19,2":["Quantity columns: one column PER MODEL LEVEL - FB foundation, L1 GF, L2 1F (incl. the 2-storey wing and the bays), L3 2F, L4 3F (Flat 5 attic: eaves walls + NE party wall) - and a ROOF column. One building: the Site total is the sum of the columns (multiplier 1) and is a live formula.",null,76],"20,1":["2.4",null,72],"20,2":["Sources: Basis Point Design planning drawings P01-P16 Rev E (10.03.2022, 1:100 @ A3: GF / 1F / 2F / 3F plans, elevations P13 / P14, sections); the BuildEase quotation model 03_Models/BC_build.skp through its spec (04_Logs/specs/BC_spec.json, BC_floors.json), build reports (04_Logs/build/BC: bcw_fit, roof_* / struct_*, eaves, BCP_* TLSTF partitions) and the Report Tool component export (04_Logs/takeoff/BC_components.json: inner / outer EPS face areas of the 1181 modelled forms, openings net). Measured offline by 05_Scripts/bc_boq.py (no live model).",null,76],"22,1":["3  Assumptions",null,100],"23,1":["3.1",null,72],"23,2":["Walls: external 6in XR35 (355.6 overall), separating walls (stair core + flat separating wall) 6in Standard (285.8). The ICF external face is on the drawn outer face (drawn 220 brick: rooms lose ~136). Frames tight to the back of the outer EPS (101.8): internal reveal 211.",null,76],"24,1":["3.2",null,72],"24,2":["Levels: FB -914.4 to 0 (2 courses on a strip footing by others, top = GF FFL); FFLs GF 0 / 1F 2,743.2 / 2F 5,486.4 / 3F 8,229.6; 3F eaves walls cut at 9,144 (+ 150 plate = 9,294); NE party wall to 11,430 (under the covering); ridge ~12.00 m above GF FFL (geometric estimate: 33 deg planes over the plate line, heel ignored).",null,76],"25,1":["3.3",null,72],"25,2":["External finishes: gault brick slips with reconstituted stone detailing, rendered cornice, natural slate (materials table P13 / P14); ground ~150 below GF FFL all round (not surveyed). The NE party wall face against No. 27 has no facing where it abuts.",null,76],"26,1":["3.4",null,72],"26,2":["Floors: precast B&B BY OTHERS (GF 150 + 150 insulation + 50 screed; 1F-3F 150 + 100 topping + 25 screed) per BC_floors.json; ceilings under them; the stair core a triple-volume void with its ceiling at the 3F soffit; the Flat 5 attic vaulted on the slope (ASSUMED).",null,76],"27,1":["3.5",null,72],"27,2":["Internal doors: 18 doorsets / 18 leaves - TLSTF partition doors + 6 PROVISIONAL FD30S flat entrance doors; leaves = the largest standard 1,981 leaf that fits the opening less 68, pairs at 1,150 and over. Partitions: TLSTF 38 x 89 C16 - GF 16 walls 33.4 m / 1F 15 walls 33.0 m / 2F 9 walls 17.7 m = 84.1 m, 12 door openings.",null,76],"28,1":["3.6",null,72],"28,2":["Roofs: 33 deg cut roofs, member counts from struct_Main / struct_Wing; rafter length estimated from the slope area (194.5 m2) at 600 c/c; hips / ridges / valley from the straight-skeleton height field; no rooflights / PV (none drawn); 4 bay roofs provisional.",null,76],"30,1 lls and B&B separating floors - not Robust Details: pre-completion testing); Part K (all window sills 457 - guarding / restrictors at 1F+); Part M (Flat 1 \"disabled adapted\", M4(3)); Parts L / O / F (acoustic windows, overheating in London).",null,76],"40,1":["5.4",null,72],"40,2":["LABC WARRANTY: 4 storeys incl. the attic - ICF capped at 3 storeys unless an independent engineer inspects pre-pour and signs off; provider to confirm.",null,76],"41,1":["5.5",null,72],"41,2":["PARTY WALL: the NE wall abuts No. 27 Bromfelde Road - Party Wall etc. Act 1996 notices, the junction with No. 27's roof / facing, fire-stopping at the compartment-wall head (Bills 1A.9, 6A.6, 7B.10).",null,76],"42,1":["5.6",null,72],"42,2":["SITE ACCESS: corner plot on residential streets in Clapham - artic access / unloading / parking suspensions by the contractor.",null,76],"43,1":["5.7",null,72],"43,2":["Assumed (not drawn / not modelled): ground ~150 below GF FFL all round; brick-SLIP facing on the ICF (not a brick outer leaf); the Flat 5 attic vaulted on the slope; a warm main roof / cold wing roof; the wing plate level; bay roofs at 33 deg; 1 privacy set + 1 FD30S entrance door per flat; downpipes ~1 per 10 m of gutter; the stairs (not modelled).",null,76],"44,1":["5.8",null,72],"44,2":["DATA CHECK: partition door opening 554 is below the smallest standard doorset (533 + 68) - cupboard / store door? check",null,76],"46,1":["6  What IS in the Nudura price (Quotation ES26-087, NET GBP 50,343.06)",null,100],"47,1":["6.1",null,72],"47,2":["Nudura ICF kit as modelled in the BuildEase Design Suite: 1181 forms modelled (FB 117 / L1 388 / L2 372 / L3 227 / L4 77) / 709 to order after the cut optimiser (FB 80 / L1 208 / L2 209 / L3 153 / L4 59), 6in XR35 external walls + 6in Standard separating walls, materials GBP 40,821.58.",null,76],"48,1":["6.2",null,72],"48,2":["Accessories: VJC clips, end caps, Form-Lock, lintel closures, spray foam.",null,76],"49,1":["6.3",null,72],"49,2":["BuildEase Pre-Cut function render(name) {
